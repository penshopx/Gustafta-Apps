name: External ecosystem monitor configuration audit

on:
  # Production schedule intentionally disabled; manual audit is read-only.
  # Planned cron: 13 7 * * 1 (UTC). Enabling it requires separate operator approval.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-cronitor-config-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Separate weekly timers, not the checker/watchdog checks. Ping at entry:
      # checkout/npm/provider failures must not hide receipt of a scheduled event.
      # Activation requires BOTH an approved schedule and this repository variable.
      - name: Heartbeat scheduled configuration audit to Healthchecks
        if: ${{ github.event_name == 'schedule' && vars.ECOSYSTEM_CONFIG_AUDIT_HEARTBEATS_ENABLED == 'true' }}
        continue-on-error: true
        env:
          HEARTBEAT_URL: ${{ secrets.ECOSYSTEM_CONFIG_AUDIT_HEARTBEAT_URL }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "Configuration audit Healthchecks heartbeat is not configured."
            exit 1
          fi
          if ! curl --fail --silent --output /dev/null --max-time 10 --retry 2 \
            --request POST --data '' "$HEARTBEAT_URL" > /dev/null 2>&1; then
            echo "Configuration audit Healthchecks heartbeat could not be delivered."
            exit 1
          fi
      # Best effort independently: one provider failing must not skip the other.
      - name: Heartbeat scheduled configuration audit to Cronitor
        if: ${{ github.event_name == 'schedule' && vars.ECOSYSTEM_CONFIG_AUDIT_HEARTBEATS_ENABLED == 'true' }}
        continue-on-error: true
        env:
          HEARTBEAT_URL: ${{ secrets.ECOSYSTEM_CONFIG_AUDIT_CRONITOR_URL }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "Configuration audit Cronitor heartbeat is not configured."
            exit 1
          fi
          if ! curl --fail --silent --output /dev/null --max-time 10 --retry 2 \
            --request POST --data '' "$HEARTBEAT_URL" > /dev/null 2>&1; then
            echo "Configuration audit Cronitor heartbeat could not be delivered."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Audit monitor configuration without sending telemetry
        id: audit
        continue-on-error: true
        env:
          CRONITOR_AUDIT_API_KEY: ${{ secrets.CRONITOR_AUDIT_API_KEY }}
          CRONITOR_AUDIT_BASELINE: ${{ secrets.CRONITOR_AUDIT_BASELINE }}
        run: npx tsx scripts/audit-cronitor-config.ts
      - name: Audit Healthchecks schedules and attached Email and Telegram
        id: healthchecks
        if: ${{ always() && steps.audit.outcome != 'skipped' }}
        continue-on-error: true
        env:
          HEALTHCHECKS_AUDIT_API_KEY: ${{ secrets.HEALTHCHECKS_AUDIT_API_KEY }}
          HEALTHCHECKS_AUDIT_BASELINE: ${{ secrets.HEALTHCHECKS_AUDIT_BASELINE }}
          HEALTHCHECKS_DESTINATION_BASELINE: ${{ secrets.HEALTHCHECKS_DESTINATION_BASELINE }}
          HEALTHCHECKS_OPERATOR_VERIFICATION: ${{ secrets.HEALTHCHECKS_OPERATOR_VERIFICATION }}
        run: npx tsx scripts/audit-healthchecks-config.ts
      # Scheduled failure goes via Brevo, not either audited provider. Manual dispatch is a
      # safe dry run: it never emails and never sends a fail ping to production.
      - name: Notify operator of audit failure outside monitored providers
        if: ${{ always() && github.event_name == 'schedule' && (steps.audit.outcome != 'success' || steps.healthchecks.outcome != 'success') }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_ALERT_EMAIL: ${{ secrets.BREVO_ALERT_EMAIL }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        run: npx tsx scripts/notify-monitor-config-audit.ts
      - name: Keep unverifiable configuration visible as a failed job
        if: ${{ always() && (steps.audit.outcome != 'success' || steps.healthchecks.outcome != 'success') }}
        run: |
          echo "Monitor configuration audit failed or could not be verified."
          exit 1